<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="866" height="1000" viewBox="0 0 866 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4a7d"/>
      <stop offset="1" stop-color="#1b2c50"/>
    </linearGradient>
    <clipPath id="hexclip">
      <polygon points="433,10 856,254 856,746 433,990 10,746 10,254"/>
    </clipPath>
  </defs>

  <!-- hex field -->
  <polygon points="433,10 856,254 856,746 433,990 10,746 10,254" fill="url(#field)"/>

  <!-- faint grid, ggplot2-style but darker -->
  <g clip-path="url(#hexclip)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="150" x2="866" y2="150"/>
    <line x1="0" y1="290" x2="866" y2="290"/>
    <line x1="0" y1="430" x2="866" y2="430"/>
    <line x1="0" y1="570" x2="866" y2="570"/>
    <line x1="0" y1="710" x2="866" y2="710"/>
    <line x1="0" y1="850" x2="866" y2="850"/>
    <line x1="145" y1="0" x2="145" y2="1000"/>
    <line x1="289" y1="0" x2="289" y2="1000"/>
    <line x1="433" y1="0" x2="433" y2="1000"/>
    <line x1="577" y1="0" x2="577" y2="1000"/>
    <line x1="721" y1="0" x2="721" y2="1000"/>
  </g>

  <!-- text lines with highlighted entity spans -->
  <g clip-path="url(#hexclip)">
    <!-- line 1 -->
    <rect x="193" y="258" width="128" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>
    <rect x="337" y="258" width="196" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>
    <rect x="549" y="258" width="124" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>

    <!-- line 2 : conflict event span highlighted -->
    <rect x="152" y="336" width="150" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>
    <rect x="318" y="336" width="230" height="36" rx="18" fill="#e05c3a"/>
    <rect x="564" y="336" width="150" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>

    <!-- line 3 -->
    <rect x="193" y="414" width="216" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>
    <rect x="425" y="414" width="132" height="36" rx="18" fill="#f2c14e"/>
    <rect x="573" y="414" width="100" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>

    <!-- line 4, shorter (paragraph end) -->
    <rect x="152" y="492" width="180" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>
    <rect x="348" y="492" width="120" height="36" rx="18" fill="#8fa9cf" opacity="0.55"/>
  </g>

  <!-- wordmark -->
  <text x="433" y="742" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-2"
        fill="#ffffff">conflibert<tspan fill="#f2c14e">R</tspan></text>

  <!-- hex border -->
  <polygon points="433,10 856,254 856,746 433,990 10,746 10,254"
           fill="none" stroke="#12203c" stroke-width="22" stroke-linejoin="round"/>
</svg>
</body>
</html>
